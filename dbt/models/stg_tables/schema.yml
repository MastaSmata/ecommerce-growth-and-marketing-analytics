version: 2

models:
  - name: stg_customers
    description: One row per customer, cleaned and standardized from raw_customers.
    columns:
      - name: customer_id
        description: Natural key for a customer.
        tests:
          - not_null
          - unique

  - name: stg_products
    description: One row per product, cleaned and standardized from raw_products.
    columns:
      - name: product_id
        description: Natural key for a product.
        tests:
          - not_null
          - unique

  - name: stg_campaigns
    description: One row per campaign, cleaned and standardized from raw_campaigns.
    columns:
      - name: campaign_id
        description: Natural key for a campaign.
        tests:
          - not_null
          - unique

  - name: stg_channels
    description: One row per marketing channel, cleaned and standardized from raw_channels.
    columns:
      - name: channel_name
        description: Natural key for a channel.
        tests:
          - not_null
          - unique

  - name: stg_sales
    description: >
      One row per order LINE (order_id + product_id), deduplicated on that
      composite key (keeping the most recently ingested copy) to protect
      against WRITE_APPEND retries. order_id alone is NOT unique — an
      order with multiple products has multiple legitimate rows.
    columns:
      - name: order_id
        description: Natural key for an order — NOT unique alone, see product_id.
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null
      - name: refund_status
        tests:
          - not_null
          - accepted_values:
              values: ['refunded', 'completed']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - product_id

  - name: stg_marketing
    description: >
      One row per ad record, deduplicated on ads_id (keeping the most
      recently ingested copy) to protect against WRITE_APPEND retries.
    columns:
      - name: ads_id
        description: Natural key for an ad record.
        tests:
          - not_null
          - unique
      - name: ad_spend
        tests:
          - not_null